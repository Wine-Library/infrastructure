apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: metabase-data
  labels:
    app: metabase
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabase
  labels:
    app: metabase
spec:
  # replicas is deliberately absent. The scale-down/scale-up CronJobs in
  # scheduler.yaml own this field; because the deploy pipeline uses a
  # client-side `kubectl apply -k`, a field we never send is a field apply
  # never resets, so an off-hours Metabase stays off across deploys.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: metabase
  template:
    metadata:
      labels:
        app: metabase
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: metabase
          image: metabase/metabase:v0.63.2
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: MB_DB_FILE
              value: /metabase.db/metabase.db
            - name: JAVA_OPTS
              value: -XX:MaxRAMPercentage=70.0
          volumeMounts:
            - name: data
              mountPath: /metabase.db
          # The JVM settles at ~1.5Gi resident, so the old 1Gi request was a
          # lie: the pod ran over its request and was the first thing the
          # kubelet would evict under memory pressure. CPU, by contrast, sits
          # at ~22m and was massively over-requested. A 300m limit was tried
          # and throttled JVM startup badly enough to blow the 5-minute
          # startupProbe window (observed 2026-08-19) - back to 500m.
          resources:
            requests:
              memory: "1792Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: metabase-data
---
apiVersion: v1
kind: Service
metadata:
  name: metabase
  labels:
    app: metabase
spec:
  selector:
    app: metabase
  ports:
    - name: http
      port: 80
      targetPort: http
