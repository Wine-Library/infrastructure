apiVersion: apps/v1
kind: Deployment
metadata:
  name: wine-app
  labels:
    app: wine-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wine-app
  template:
    metadata:
      labels:
        app: wine-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # wine-app is fail-fast about its database: Hikari validates a connection
      # while building the pool and Liquibase runs before the context is up, so
      # a database that is briefly unreachable - a CNPG switchover, a node
      # upgrade - takes the process down with exit code 1 instead of making it
      # wait. Recovery then depends on CrashLoopBackOff happening to retry at
      # the right moment, which is how a 40s switchover cost three restarts on
      # 2026-08-18. Blocking here keeps the JVM from ever starting against a
      # database that is not accepting connections.
      #
      # The image is the one the CNPG cluster already runs, so it is present on
      # any node hosting a database pod and costs no extra pull. Init requests
      # do not add to the pod's scheduling footprint either, since they are
      # below what the app container already asks for.
      initContainers:
        - name: wait-for-db
          image: ghcr.io/cloudnative-pg/postgresql:17.10
          # -U is not optional here: the pod runs as uid 1000, which has no
          # entry in the image's /etc/passwd, so libpq cannot derive a default
          # user name and pg_isready gives up with "no attempt" (rc 3) without
          # ever opening a socket. It never authenticates - any name gets an
          # honest answer - but taking it from the same secret the app uses
          # keeps the two in step.
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wine-db-app
                  key: username
          command:
            - sh
            - -c
            - |
              deadline=$(( $(date +%s) + 240 ))
              until pg_isready -h wine-db-rw -p 5432 -U "$DB_USERNAME" -q; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "wine-db-rw not accepting connections after 240s" >&2
                  exit 1
                fi
                echo "waiting for wine-db-rw..."
                sleep 2
              done
              echo "wine-db-rw is accepting connections"
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ "ALL" ]
      containers:
        - name: wine-app
          image: ghcr.io/wine-library/backend
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8090
            - name: management
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: wine-app-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wine-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wine-db-app
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wine-app-jwt
                  key: secret
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wine-app-mail
                  key: username
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wine-app-mail
                  key: password
            - name: WINES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wine-app-wines-api
                  key: key
          # Steady-state usage is ~5m CPU and ~450Mi. The CPU request is sized
          # for that, not for JVM warmup - the 300m limit (3x request) covers
          # the startup burst, and startupProbe allows up to 5 minutes for it.
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "300m"
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          emptyDir: { }
---
apiVersion: v1
kind: Service
metadata:
  name: wine-app
  labels:
    app: wine-app
spec:
  selector:
    app: wine-app
  ports:
    - name: http
      port: 80
      targetPort: http
