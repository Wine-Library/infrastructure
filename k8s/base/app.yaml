apiVersion: apps/v1
kind: Deployment
metadata:
  name: wine-app
  labels:
    app: wine-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wine-app
  template:
    metadata:
      labels:
        app: wine-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wine-app
          image: ghcr.io/wine-library/backend
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: wine-app-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wine-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wine-db-app
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wine-app-jwt
                  key: secret
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wine-app-mail
                  key: username
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wine-app-mail
                  key: password
            - name: WINES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wine-app-wines-api
                  key: key
          # Steady-state usage is ~5m CPU and ~450Mi. The CPU request is sized
          # for that, not for JVM warmup - the 500m limit covers the startup
          # burst, and startupProbe allows up to 5 minutes for it.
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /api/v1/actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wine-app
  labels:
    app: wine-app
spec:
  selector:
    app: wine-app
  ports:
    - name: http
      port: 80
      targetPort: http
