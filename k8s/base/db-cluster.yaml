apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wine-db
spec:
  instances: 2

  imageName: ghcr.io/cloudnative-pg/postgresql:17.10

  # Measured at ~12m CPU and ~75Mi per instance under current load. Memory
  # request stays well above that to leave room for shared_buffers plus page
  # cache as the dataset grows.
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  storage:
    size: 5Gi

  # botocore >=1.36 defaults PutObject to a checksum-trailer transfer
  # encoding GCS's S3-compatible XML API rejects outright, returning
  # SignatureDoesNotMatch/Invalid argument on every WAL archive and backup
  # attempt. Forcing "when_required" drops back to the plain signing GCS
  # actually supports. AWS S3 itself is unaffected either way. See
  # RECOVERY.md for how this surfaced during the restore drill.
  env:
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: "when_required"
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: "when_required"

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"

  bootstrap:
    initdb:
      database: wine_library
      owner: wine_app
      secret:
        name: wine-db-app

  # Base path only — each overlay patches destinationPath to its own
  # subfolder (see overlays/*/kustomization.yaml) so environments don't write
  # into each other's backups. gcs-backup-creds is created by hand per
  # namespace; see RECOVERY.md and k8s/README.md.
  backup:
    barmanObjectStore:
      destinationPath: "s3://wine-library-mate-wine-db-backups/"
      endpointURL: "https://storage.googleapis.com"
      s3Credentials:
        accessKeyId:
          name: gcs-backup-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: gcs-backup-creds
          key: SECRET_ACCESS_KEY
    retentionPolicy: "7d"
