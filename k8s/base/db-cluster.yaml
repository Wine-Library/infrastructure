apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wine-db
spec:
  instances: 2

  imageName: ghcr.io/cloudnative-pg/postgresql:17.10

  # Measured at ~12m CPU and ~75Mi per instance under current load. Memory
  # request stays well above that to leave room for shared_buffers plus page
  # cache as the dataset grows.
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  storage:
    size: 5Gi

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"

  bootstrap:
    initdb:
      database: wine_library
      owner: wine_app
      secret:
        name: wine-db-app
