apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../../base

labels:
  - pairs:
      environment: dev

images:
  - name: ghcr.io/wine-library/backend
    newTag: dev

configMapGenerator:
  - name: wine-app-config
    behavior: merge
    literals:
      - LIQUIBASE_CONTEXTS=dev

patches:
  - target:
      kind: Cluster
      name: wine-db
    patch: |
      - op: replace
        path: /spec/instances
        value: 1
