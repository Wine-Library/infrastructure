apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../../base

components:
  - ../../components/frontend

labels:
  - pairs:
      environment: dev

images:
  - name: ghcr.io/wine-library/backend
    newTag: dev
  - name: ghcr.io/wine-library/frontend
    newTag: dev

configMapGenerator:
  - name: wine-app-config
    behavior: merge
    literals:
      - LIQUIBASE_CONTEXTS=dev
      - FRONTEND_URL=https://dev.wine-library.xyz

patches:
  # Single instance on a smaller memory footprint; CPU now matches base.
  - target:
      kind: Cluster
      name: wine-db
    patch: |
      - op: replace
        path: /spec/instances
        value: 1
      - op: replace
        path: /spec/resources/requests/memory
        value: 256Mi
  # wine-app deliberately has no resource patch here. The old dev override
  # asked for 320Mi while the pod actually uses ~440Mi, which left it running
  # over its own request; base (100m / 512Mi) is both cheaper on CPU and
  # honest about memory.
  - target:
      kind: Ingress
      name: wine
    patch: |
      - op: replace
        path: /spec/tls/0/hosts/0
        value: dev.wine-library.xyz
      - op: replace
        path: /spec/rules/0/host
        value: dev.wine-library.xyz
