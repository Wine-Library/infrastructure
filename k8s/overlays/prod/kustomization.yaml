apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../../base

labels:
  - pairs:
      environment: prod

images:
  - name: ghcr.io/wine-library/backend
    newTag: v0.1.0

patches:
  - target:
      kind: Ingress
      name: wine
    patch: |
      - op: replace
        path: /spec/tls/0/hosts/0
        value: wine-library.xyz
      - op: replace
        path: /spec/rules/0/host
        value: wine-library.xyz
  - target:
      kind: Cluster
      name: wine-db
    patch: |
      - op: replace
        path: /spec/instances
        value: 1
      - op: replace
        path: /spec/storage/size
        value: 10Gi
  - target:
      kind: Deployment
      name: wine-app
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
