apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../../base

components:
  - ../../components/metabase

labels:
  - pairs:
      environment: prod

images:
  - name: ghcr.io/wine-library/backend
    newTag: v0.1.0

patches:
  - target:
      kind: Cluster
      name: wine-db
    patch: |
      - op: replace
        path: /spec/storage/size
        value: 10Gi
  - target:
      kind: Deployment
      name: wine-app
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
