apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base

components:
  - ../../components/metabase

labels:
  - pairs:
      environment: staging

images:
  - name: ghcr.io/wine-library/backend
    newTag: staging

configMapGenerator:
  - name: wine-app-config
    behavior: merge
    literals:
      - LIQUIBASE_CONTEXTS=staging
