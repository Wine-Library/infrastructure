apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - frontend.yaml
  - grafana.yaml
  - ingress.yaml

configMapGenerator:
  - name: grafana-provisioning
    files:
      - datasources.yaml=provisioning/datasources.yaml
      - dashboards.yaml=provisioning/dashboards.yaml
  - name: grafana-dashboards
    files:
      - dashboards/wine-library-overview.json

labels:
  - pairs:
      app.kubernetes.io/part-of: wine-library
