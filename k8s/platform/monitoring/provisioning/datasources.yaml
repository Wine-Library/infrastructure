apiVersion: 1
datasources:
  - name: Managed Prometheus
    type: prometheus
    access: proxy
    url: http://frontend.monitoring.svc:9090
    isDefault: true
    jsonData:
      timeInterval: 60s
      httpMethod: POST
  - name: GCP Billing
    uid: gcp-billing
    type: grafana-bigquery-datasource
    jsonData:
      authenticationType: gce
      defaultProject: wine-library-mate
      processingLocation: europe-central2
