apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wine-db-restore
  namespace: staging
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.10
  storage:
    size: 5Gi
  bootstrap:
    recovery:
      source: wine-db-backup
      recoveryTarget:
        targetTime: "REPLACE_ME"
  externalClusters:
    - name: wine-db-backup
      barmanObjectStore:
        destinationPath: "s3://wine-library-mate-wine-db-backups/staging/"
        endpointURL: "https://storage.googleapis.com"
        s3Credentials:
          accessKeyId:
            name: gcs-backup-creds
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: gcs-backup-creds
            key: SECRET_ACCESS_KEY
