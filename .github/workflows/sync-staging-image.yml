name: Sync staging image

run-name: sync staging image - ${{ github.event_name }}

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  sync:
    uses: ./.github/workflows/sync-image.yml
    with:
      namespace: staging
      image_tag: staging
    secrets: inherit