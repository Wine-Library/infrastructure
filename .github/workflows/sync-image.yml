name: Sync image

on:
  workflow_call:
    inputs:
      namespace:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      image_repo:
        description: 'ghcr.io repository to watch, e.g. wine-library/backend.'
        required: true
        type: string
      deployment:
        description: 'Deployment to restart. Also the value of its `app` label.'
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/212393176266/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@wine-library-mate.iam.gserviceaccount.com

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: wine-library
          # The cluster is zonal, so this is a zone and not the region - see the
          # `zone` variable in terraform/variables.tf for why. Passing the region
          # here fails the lookup outright: `not found: .../locations/
          # europe-central2/clusters/wine-library`.
          location: europe-central2-a

      - id: check
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_REPO: ${{ inputs.image_repo }}
          NAMESPACE: ${{ inputs.namespace }}
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          set -euo pipefail

          token=$(curl -sf "https://ghcr.io/token?scope=repository:${IMAGE_REPO}:pull&service=ghcr.io" | jq -r .token)

          registry=$(curl -sfI \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${IMAGE_REPO}/manifests/${IMAGE_TAG}" \
            | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}')

          running=$(kubectl get pods -n "$NAMESPACE" -l "app=${DEPLOYMENT}" \
            -o jsonpath='{.items[0].status.containerStatuses[0].imageID}' | sed 's/.*@//')

          echo "image:    ${IMAGE_REPO}:${IMAGE_TAG}"
          echo "registry: ${registry:-<empty>}"
          echo "running:  ${running:-<empty>}"

          if [ -z "$registry" ]; then
            echo "could not read digest from registry"
            exit 1
          fi

          if [ "$registry" = "$running" ]; then
            echo "up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "image changed, redeploying"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.changed == 'true'
        run: kubectl rollout restart deployment/${{ inputs.deployment }} -n ${{ inputs.namespace }}

      - if: steps.check.outputs.changed == 'true'
        run: kubectl rollout status deployment/${{ inputs.deployment }} -n ${{ inputs.namespace }} --timeout=300s
